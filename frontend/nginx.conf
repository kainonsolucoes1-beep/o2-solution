server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — rota tudo para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA é cacheado — senão o navegador continua apontando pros
    # bundles antigos depois de um deploy (o hard refresh que estava sendo
    # preciso a cada deploy).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Bundles do Vite têm hash no nome → cache longo, imutável.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rotas admin com timeout longo (sync histórico pode demorar)
    location ~ ^/api/v1/admin/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Proxy para o backend FastAPI
    location ~ ^/(api|docs|openapi\.json|health|redoc) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
