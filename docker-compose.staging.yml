# Staging co-hospedado na mesma instância da produção, SOB DEMANDA.
# Sobe via workflow "Deploy staging" (push na branch `staging`) e desce via
# workflow_dispatch (action: down) — não fica no ar o tempo todo.
#
# Projeto Docker próprio (`o2-staging`), banco/volume próprios, imagens
# buildadas a partir da branch `staging`. O Caddy da produção alcança o
# `staging-frontend` pela rede externa `o2-edge`.
#
# Comandos sempre com --env-file .env.staging (senão a substituição de
# ${DB_PASSWORD} etc. pegaria o .env da produção).

name: o2-staging

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env.staging
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-o2_solution}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-o2_solution}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: ghcr.io/kainonsolucoes1-beep/o2-solution-backend:${STAGING_TAG:-staging}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/kainonsolucoes1-beep/o2-solution-frontend:${STAGING_TAG:-staging}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      default: {}
      o2-edge:
        aliases:
          - staging-frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_staging_data:

networks:
  default: {}
  o2-edge:
    external: true
