name: Deploy to AWS EC2

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Etapa 1: monta as imagens na infra do GitHub e publica no GHCR ──────────
  # (a máquina de produção deixa de fazer `--build`, que era o que causava a
  #  lentidão durante o deploy)
  build-images:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deploy na máquina: só `git pull` + `docker compose pull` + `up`.
  #    A instância nunca mais compila imagem (era o que travava a produção). ────
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    needs: build-images
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/o2-solution

            PREV_COMMIT=$(git rev-parse HEAD)
            echo ">>> Commit atual (referência de rollback): $PREV_COMMIT"

            echo ">>> Pull latest code"
            git pull origin main
            NEW_COMMIT=$(git rev-parse HEAD)

            echo ">>> Login no GHCR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo ">>> Puxar imagens ($IMAGE_TAG) e subir sem build (health check dos serviços)"
            DEPLOY_FAIL=""
            if ! docker compose -f docker-compose.prod.yml pull backend frontend; then
              echo "!!! pull das imagens falhou"; DEPLOY_FAIL=1
            elif ! docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans --wait --wait-timeout 150; then
              echo "!!! containers não passaram no health check"; DEPLOY_FAIL=1
            fi

            if [ -n "$DEPLOY_FAIL" ]; then
              echo "!!! Deploy do commit $NEW_COMMIT falhou — revertendo pro commit anterior ($PREV_COMMIT)"
              git reset --hard "$PREV_COMMIT"
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans --wait --wait-timeout 150 || true
              docker logout ghcr.io || true
              echo "!!! Rollback concluído. Investigar o commit $NEW_COMMIT antes de tentar de novo."
              exit 1
            fi

            docker logout ghcr.io || true

            echo ">>> Recarregar Caddy (Caddyfile pode ter mudado)"
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null \
              || docker compose -f docker-compose.prod.yml restart caddy || true

            echo ">>> Limpar imagens antigas"
            docker image prune -f

            echo "Deploy concluído em $(date) — commit $NEW_COMMIT (imagem $IMAGE_TAG)"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
