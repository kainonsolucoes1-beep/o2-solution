name: Deploy to AWS EC2

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/o2-solution

            PREV_COMMIT=$(git rev-parse HEAD)
            echo ">>> Commit atual (referência de rollback): $PREV_COMMIT"

            echo ">>> Pull latest code"
            git pull origin main
            NEW_COMMIT=$(git rev-parse HEAD)

            echo ">>> Build e subir containers (aguardando health check dos serviços)"
            if ! docker compose -f docker-compose.prod.yml up -d --build --remove-orphans --wait --wait-timeout 150; then
              echo "!!! Deploy do commit $NEW_COMMIT falhou no health check — revertendo pro commit anterior ($PREV_COMMIT)"
              git reset --hard "$PREV_COMMIT"
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans --wait --wait-timeout 150 || true
              echo "!!! Rollback concluído. Investigar o commit $NEW_COMMIT antes de tentar de novo."
              exit 1
            fi

            echo ">>> Limpar imagens antigas"
            docker image prune -f

            echo "Deploy concluído em $(date) — commit $NEW_COMMIT"
