name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      action:
        description: "up = subir/atualizar · down = desligar (libera RAM da instância)"
        type: choice
        options: [up, down]
        default: up

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Build só quando for subir (push, ou dispatch com action=up)
  build-images:
    name: Build & push images (staging)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.action == 'up'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:staging
            ghcr.io/${{ github.repository }}-backend:staging-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-staging
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: |
            VITE_API_URL=
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:staging
            ghcr.io/${{ github.repository }}-frontend:staging-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend-staging

  deploy:
    name: SSH deploy (staging)
    runs-on: ubuntu-latest
    needs: build-images
    # roda no `up` (build ok) e também no `down` (build pulado)
    if: always() && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Gerenciar staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,STAGING_TAG,STAGING_ACTION
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/o2-solution
            COMPOSE="docker compose --env-file .env.staging -f docker-compose.staging.yml"

            if [ ! -f .env.staging ]; then
              echo "!!! .env.staging não existe na instância. Crie primeiro (ver STAGING.md). Abortando."
              exit 1
            fi

            if [ "$STAGING_ACTION" = "down" ]; then
              echo ">>> Desligando o staging (libera RAM)"
              $COMPOSE down
              docker image prune -f
              echo "Staging desligado em $(date)"
              exit 0
            fi

            echo ">>> A branch main já traz o docker-compose.staging.yml atualizado via deploy de produção."
            docker network create o2-edge 2>/dev/null || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            echo ">>> Subir staging ($STAGING_TAG)"
            if ! $COMPOSE pull || ! $COMPOSE up -d --no-build --remove-orphans --wait --wait-timeout 150; then
              echo "!!! staging não subiu — ver logs. (Não há rollback: é ambiente de teste.)"
              docker logout ghcr.io || true
              exit 1
            fi
            docker logout ghcr.io || true

            echo ">>> Recarregar o Caddy da produção pra enxergar o staging-frontend"
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true

            echo "Staging no ar: https://staging.o2sig.com.br  ($STAGING_TAG) — $(date)"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          STAGING_TAG: staging-${{ github.sha }}
          STAGING_ACTION: ${{ inputs.action || 'up' }}
