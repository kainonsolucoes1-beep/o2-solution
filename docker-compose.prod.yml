services:
  # ─── Banco de dados ──────────────────────────────────────────────────────────
  # Para usar AWS RDS: remova este serviço e ajuste DATABASE_URL em .env.production
  postgres:
    image: postgres:15-alpine
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-o2_solution}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-o2_solution}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    # imagem pré-montada no GitHub Actions (GHCR). `build:` fica só de fallback
    # pra rebuild manual na máquina; o deploy normal faz `pull`, nunca `--build`.
    image: ghcr.io/kainonsolucoes1-beep/o2-solution-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Frontend React + Nginx ───────────────────────────────────────────────────
  frontend:
    image: ghcr.io/kainonsolucoes1-beep/o2-solution-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Caddy: TLS/HTTPS + proxy reverso ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    # o2-edge: rede compartilhada com o projeto de staging (o2-staging), pra o
    # Caddy alcançar o `staging-frontend` quando ele estiver no ar.
    networks:
      - default
      - o2-edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  o2-edge:
    external: true
